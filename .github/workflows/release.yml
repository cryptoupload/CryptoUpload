name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0-beta.2) — a manual dispatch has no tag push to take it from'
        required: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/apps/desktop/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            pkg-config \
            libfuse3-dev \
            libudev-dev \
            fuse3 \
            patchelf \
            xdg-utils \
            fakeroot \
            dpkg-dev

      - name: Remove build machine paths from the binaries
        shell: bash
        run: |
          cargo_home="${CARGO_HOME:-${USERPROFILE:-$HOME}/.cargo}"
          rustup_home="${RUSTUP_HOME:-${USERPROFILE:-$HOME}/.rustup}"
          echo "RUSTFLAGS=--remap-path-prefix=${GITHUB_WORKSPACE}=src --remap-path-prefix=${cargo_home}=cargo --remap-path-prefix=${rustup_home}=rustup" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: app/apps/desktop

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app/apps/desktop
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'CryptoUpload ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            See [CHANGELOG.md](https://github.com/cryptoupload/CryptoUpload/blob/main/CHANGELOG.md) for details.

            > ⚠️ **Unsigned beta:** on Windows, SmartScreen warns on first launch — click "More info → Run anyway".
          releaseDraft: true
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - name: Save Linux updater signature
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sig-linux
          path: |
            app/target/release/bundle/appimage/CryptoUpload_*_amd64.AppImage.sig
            app/target/release/bundle/deb/CryptoUpload_*_amd64.deb.sig
          if-no-files-found: error

      - name: Save Windows updater signature
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sig-windows
          path: app/target/release/bundle/nsis/CryptoUpload_*_x64-setup.exe.sig
          if-no-files-found: error

  generate-updater-json:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download all signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sig-*
          merge-multiple: false
          path: sigs

      - name: Generate and upload latest.json
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          BASE_URL="https://github.com/cryptoupload/CryptoUpload/releases/download/${TAG}"

          sig() {
            local f
            f=$(find sigs -name "$1" | head -1)
            [ -n "$f" ] && [ -s "$f" ] || { echo "::error::missing updater signature $1"; exit 1; }
            cat "$f"
          }
          APPIMAGE_SIG=$(sig "CryptoUpload_*_amd64.AppImage.sig")
          DEB_SIG=$(sig "CryptoUpload_*_amd64.deb.sig")
          WINDOWS_SIG=$(sig "CryptoUpload_*_x64-setup.exe.sig")

          jq -n \
            --arg version  "$VERSION" \
            --arg pub_date "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg appimage_sig "$APPIMAGE_SIG" \
            --arg appimage_url "${BASE_URL}/CryptoUpload_${VERSION}_amd64.AppImage" \
            --arg deb_sig      "$DEB_SIG" \
            --arg deb_url      "${BASE_URL}/CryptoUpload_${VERSION}_amd64.deb" \
            --arg windows_sig  "$WINDOWS_SIG" \
            --arg windows_url  "${BASE_URL}/CryptoUpload_${VERSION}_x64-setup.exe" \
            '{
              version: $version,
              notes: "See CHANGELOG.md for details.",
              pub_date: $pub_date,
              platforms: {
                "linux-x86_64":          {signature: $appimage_sig, url: $appimage_url},
                "linux-x86_64-appimage": {signature: $appimage_sig, url: $appimage_url},
                "linux-x86_64-deb":      {signature: $deb_sig,      url: $deb_url},
                "windows-x86_64":        {signature: $windows_sig,  url: $windows_url},
                "windows-x86_64-nsis":   {signature: $windows_sig,  url: $windows_url}
              }
            }' > latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "${TAG}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installers under version-free names
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          mkdir fixed && cd fixed
          gh release download "${TAG}" \
            --pattern "CryptoUpload_${VERSION}_x64-setup.exe" \
            --pattern "CryptoUpload_${VERSION}_amd64.deb" \
            --pattern "CryptoUpload_${VERSION}_amd64.AppImage"
          mv "CryptoUpload_${VERSION}_x64-setup.exe" CryptoUpload-windows-setup.exe
          mv "CryptoUpload_${VERSION}_amd64.deb" CryptoUpload-linux-amd64.deb
          mv "CryptoUpload_${VERSION}_amd64.AppImage" CryptoUpload-linux-amd64.AppImage
          gh release upload "${TAG}" CryptoUpload-windows-setup.exe CryptoUpload-linux-amd64.deb CryptoUpload-linux-amd64.AppImage --clobber

      - name: Upload SHA-256 checksums
        shell: bash
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          VERSION="${TAG#v}"
          mkdir sums && cd sums
          gh release download "${TAG}" \
            --pattern "CryptoUpload_${VERSION}_x64-setup.exe" \
            --pattern "CryptoUpload_${VERSION}_amd64.deb" \
            --pattern "CryptoUpload_${VERSION}_amd64.AppImage"
          cp "CryptoUpload_${VERSION}_x64-setup.exe" CryptoUpload-windows-setup.exe
          cp "CryptoUpload_${VERSION}_amd64.deb" CryptoUpload-linux-amd64.deb
          cp "CryptoUpload_${VERSION}_amd64.AppImage" CryptoUpload-linux-amd64.AppImage
          sha256sum CryptoUpload* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${TAG}" SHA256SUMS.txt --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
