[package]
name = "cu-backend-gdrive"
description = "StorageBackend for Google Drive (drive.file scope only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
bytes = "1"
cu-backend = { path = "../cu-backend", version = "0.0.0" }
cu-oauth = { path = "../cu-oauth", version = "0.0.0" }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
serde_json = { version = "=1.0.151" }
tokio = { version = "=1.53.1", default-features = false, features = ["sync", "time"] }

