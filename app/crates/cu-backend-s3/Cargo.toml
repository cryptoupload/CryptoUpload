[package]
name = "cu-backend-s3"
description = "StorageBackend for S3 and compatible providers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
aws-sdk-s3 = { version = "=1.96.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
    "behavior-version-latest",
] }
aws-smithy-types = "=1.3.4"
aws-smithy-http-client = { version = "=1.1.4", default-features = false, features = ["default-client", "rustls-aws-lc"] }
aws-smithy-runtime-api = { version = "=1.9.2", features = ["client"] }
bytes = "1"
cu-backend = { path = "../cu-backend", version = "0.0.0" }
crc32c = "=0.6.8"
tokio = { version = "=1.53.3", default-features = false, features = [
    "time",
    "sync",
] }

