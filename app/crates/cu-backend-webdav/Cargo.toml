[package]
name = "cu-backend-webdav"
description = "StorageBackend for WebDAV (self-hosted servers such as Nextcloud) — HTTPS by default, Basic authentication."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "=0.1.92"
cu-backend = { path = "../cu-backend", version = "0.0.0" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream", "socks"] }
roxmltree = "=0.20.0"
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "sync", "time"] }

