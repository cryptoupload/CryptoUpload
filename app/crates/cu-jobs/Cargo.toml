[package]
name = "cu-jobs"
description = "Job model, scheduler, filesystem watcher, run history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cu-msg = { path = "../cu-msg", version = "0.0.0" }
async-trait = "=0.1.92"
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "std"] }
fs4 = { version = "=1.1.0", default-features = false, features = ["sync"] }
notify = { version = "=8.2.0", default-features = false, features = ["macos_fsevent"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt", "signal", "sync", "time"] }

