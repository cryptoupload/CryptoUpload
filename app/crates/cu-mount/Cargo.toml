[package]
name = "cu-mount"
description = "Virtual drive: neutral VfsOps on top of fuser/winfsp/webdav."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cu-msg = { path = "../cu-msg", version = "0.0.0" }
cu-backend = { path = "../cu-backend", version = "0.0.0" }
cu-crypto = { path = "../cu-crypto", version = "0.0.0" }
cu-format = { path = "../cu-format", version = "0.0.0" }
cu-vfs = { path = "../cu-vfs", version = "0.0.0" }
lru = { version = "=0.18.2", default-features = false }
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { version = "=0.18.0", default-features = false, features = ["libfuse3"] }

[target.'cfg(windows)'.dependencies]
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread"] }
winfsp = "=0.13.1"
winfsp-sys = "=0.12.1"
widestring = "1"
windows = { version = "0.61", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winfsp = "=0.13.1"

