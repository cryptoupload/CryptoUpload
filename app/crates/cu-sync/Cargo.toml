[package]
name = "cu-sync"
description = "Sync engine: scan, three-way diff, plan, execute, commit, conflicts, verify."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cu-msg = { path = "../cu-msg", version = "0.0.0" }
async-trait = "=0.1.92"
cu-backend = { path = "../cu-backend", version = "0.0.0" }
cu-crypto = { path = "../cu-crypto", version = "0.0.0" }
cu-format = { path = "../cu-format", version = "0.0.0" }
cu-index = { path = "../cu-index", version = "0.0.0" }
cu-vfs = { path = "../cu-vfs", version = "0.0.0" }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
tokio = { version = "=1.53.1", default-features = false, features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "=0.1.11"
