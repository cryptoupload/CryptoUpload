[package]
name = "cu-oauth"
description = "OAuth authorization-code + PKCE ceremony on loopback, shared by the backends that use an OAuth provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
cu-msg = { path = "../cu-msg", version = "0.0.0" }
form_urlencoded = "=1.2.2"
oauth2 = { version = "=5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls", "stream", "socks"] }
subtle = "=2.6.1"
tokio = { version = "=1.53.1", default-features = false, features = ["net", "io-util", "time"] }

