[package]
name = "cryptoupload-desktop"
description = "Tauri v2 shell: the desktop app on top of cu-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[lib]
name = "cryptoupload_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
cu-core = { path = "../../../../app/crates/cu-core", version = "0.0.0" }
cu-msg = { path = "../../../../app/crates/cu-msg", version = "0.0.0" }
data-encoding = { version = "=2.11.1", default-features = false, features = ["alloc"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tauri = { version = "=2.11.5", features = ["tray-icon"] }
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-global-shortcut = "=2.3.2"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = { version = "=2.11.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tokio = { version = "=1.53.3", default-features = false, features = ["sync", "rt", "time"] }
zeroize = "=1.9.0"

