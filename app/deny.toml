[graph]
all-features = true

[advisories]
unmaintained = "all"
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2026-0194", reason = "denial of service in quick-xml via plist/tauri-utils; the only input is our own local bundle, never untrusted network data" },
    { id = "RUSTSEC-2026-0195", reason = "same as RUSTSEC-2026-0194: same quick-xml/plist, local input only" },

    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; pulled by keyring/secret-service and Tauri plugins, no upgrade path yet; unmaintained notice, not a vulnerability" },
    { id = "RUSTSEC-2026-0371", reason = "same as RUSTSEC-2026-0370 (zbus_names)" },
    { id = "RUSTSEC-2026-0372", reason = "same as RUSTSEC-2026-0370 (zvariant_derive)" },
    { id = "RUSTSEC-2024-0411", reason = "gtk-rs GTK3, part of the Tauri Linux backend (webkit2gtk)" },
    { id = "RUSTSEC-2024-0412", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0413", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0414", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0415", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0416", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0417", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0418", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0419", reason = "same as RUSTSEC-2024-0411" },
    { id = "RUSTSEC-2024-0420", reason = "same as RUSTSEC-2024-0411" },

    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros/gtk3-macros, same GTK3 chain as RUSTSEC-2024-0411" },

    { id = "RUSTSEC-2025-0075", reason = "unic-char-range via urlpattern/tauri-utils, static Unicode data only" },
    { id = "RUSTSEC-2025-0080", reason = "same as RUSTSEC-2025-0075" },
    { id = "RUSTSEC-2025-0081", reason = "same as RUSTSEC-2025-0075" },
    { id = "RUSTSEC-2025-0098", reason = "same as RUSTSEC-2025-0075" },
    { id = "RUSTSEC-2025-0100", reason = "same as RUSTSEC-2025-0075" },

    { id = "RUSTSEC-2024-0436", reason = "paste via winfsp (macro expansion at compile time only)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "GPL-3.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-workspace = true
deny = [
    { crate = "openssl-sys", reason = "rustls only" },
    { crate = "openssl", reason = "rustls only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
